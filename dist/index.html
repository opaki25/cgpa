<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CGPA Calculator</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>CGPA Calculator</h1>
<p>Enter your grades. Leave future semesters blank.</p>
<div class="settings"><label>Course length<select id="years"><option value="3">3 years</option><option value="4">4 years</option><option value="2">2 years</option><option value="5">5 years</option><option value="6">6 years</option></select></label><label>GPA scale<select id="scale"><option value="5">5.0</option><option value="4">4.0</option></select></label></div>
<div id="semesters"></div>
<p class="hint">Planning ahead? Mark future grades as Expected.</p>
<p id="error" role="alert"></p>
<section class="results" aria-live="polite"><div><span>Current CGPA</span><strong id="current">—</strong></div><div class="maximum"><span>Maximum final CGPA</span><strong id="maximum">5.00</strong></div><p id="max-note"></p><div><span>Expected final CGPA</span><strong id="projected">—</strong></div><p id="projection-note"></p></section>
<div class="bottom"><small>Estimate assumes equal semester credits.</small><button id="reset" type="button">Clear</button></div>
</main><script type="module" src="app.js"></script></body></html>
